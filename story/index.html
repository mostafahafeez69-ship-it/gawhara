<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Our Story</title>
<meta name="theme-color" content="#0b0810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Playfair+Display:ital,wght@0,700;1,500;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0810;--ink:#1b1512;--pink:#f4a6c0;--hot:#e0457b;--red:#c8382d;--cream:#f4efe3;--gold:#e7bf4a;--mute:#a79bb8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{font:22px/1.2 'VT323',monospace;touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
.p2{font-family:'Press Start 2P',monospace}
/* layout */
#top{position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px) + 52px);padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;display:none;justify-content:space-between;align-items:center;z-index:5}
#top.on{display:flex}
#chap{font:9px/1.4 'Press Start 2P',monospace;color:var(--pink);letter-spacing:.06em;max-width:55vw}
.ib{width:40px;height:40px;background:#1c1426;border:3px solid var(--cream);box-shadow:0 0 0 2px #000,3px 3px 0 2px var(--hot);color:var(--cream);font:12px 'Press Start 2P',monospace;padding:0;margin-left:8px}
.ib:active{transform:translate(2px,2px);box-shadow:0 0 0 2px #000,1px 1px 0 2px var(--hot)}
.ib.off{opacity:.5}
#stage{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 56px);display:none}
#stage.on{display:block}
#sc{display:block;width:100%;height:100%;border:3px solid #2a2035;box-shadow:0 0 0 2px #000,0 20px 60px rgba(224,69,123,.18);image-rendering:pixelated;touch-action:none;background:#000}
/* dialogue */
#dlgWrap{position:absolute;inset:0;display:none;z-index:4}
#dlgWrap.on{display:block}
#dlg{position:absolute;left:8px;right:8px;bottom:8px;min-height:104px;background:rgba(14,10,20,.94);border:3px solid var(--cream);box-shadow:0 0 0 3px #000,5px 5px 0 3px rgba(224,69,123,.55);padding:16px 14px 12px}
#who{position:absolute;top:-14px;left:12px;font:9px 'Press Start 2P',monospace;padding:6px 8px;background:var(--hot);color:#fff;border:2px solid #000;display:none}
#who.me{background:var(--gold);color:var(--ink)}
#who.on{display:block}
#txt{font:23px/1.15 'VT323',monospace;color:var(--cream);min-height:52px;white-space:pre-wrap}
#txt.nar{color:#cfc4e6;font-style:italic}
#nxt{position:absolute;right:10px;bottom:6px;color:var(--pink);font:10px 'Press Start 2P',monospace;animation:blink 1s steps(2) infinite;display:none}
#nxt.on{display:block}
@keyframes blink{50%{opacity:0}}
#ctrl{position:absolute;left:0;right:0;bottom:10px;display:none;justify-content:space-between;padding:0 10px;z-index:3;pointer-events:none}
#ctrl.on{display:flex}
#ctrl button{pointer-events:auto;width:64px;height:56px;background:rgba(20,14,30,.75);border:3px solid var(--cream);box-shadow:0 0 0 2px #000;color:var(--cream);font:14px 'Press Start 2P',monospace;touch-action:none}
#ctrl button.act{background:var(--hot)}
#tapHint{position:absolute;left:0;right:0;top:8px;text-align:center;font:9px 'Press Start 2P',monospace;color:var(--pink);opacity:.9;pointer-events:none;text-shadow:0 2px 0 #000}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;flex-direction:column;text-align:center}
.ov.on{display:flex}
.pbtn{font:11px 'Press Start 2P',monospace;background:var(--hot);color:#fff;border:3px solid var(--cream);box-shadow:0 0 0 3px #000,5px 5px 0 3px #000;padding:15px 20px;margin:8px 6px;min-width:190px}
.pbtn:active{transform:translate(3px,3px);box-shadow:0 0 0 3px #000,2px 2px 0 3px #000}
.pbtn.alt{background:#2a2040}
.pbtn.sm{min-width:0;font-size:9px;padding:11px 14px}
#title{background:radial-gradient(ellipse at 50% 35%,#2a1438 0%,#0b0810 70%);overflow:hidden}
#title h1{font:22px/1.5 'Press Start 2P',monospace;color:var(--cream);margin:0 0 6px;text-shadow:3px 3px 0 var(--hot),6px 6px 0 #000}
#title .tsub{font:9px 'Press Start 2P',monospace;color:var(--pink);margin-bottom:12px;letter-spacing:.1em}
#duo{height:min(34vh,240px);margin:6px 0 8px}
#title .press{font:10px 'Press Start 2P',monospace;color:var(--gold);animation:blink 1.2s steps(2) infinite;margin-top:6px}
#title .by{font:18px 'VT323',monospace;color:var(--mute);margin-top:14px}
.stars{position:absolute;inset:0;pointer-events:none;z-index:-1}
.stars i{position:absolute;width:2px;height:2px;background:#fff;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
#map{background:#0b0810;justify-content:flex-start;overflow-y:auto;padding-top:calc(env(safe-area-inset-top,0px) + 22px)}
#map h2{font:14px/1.5 'Press Start 2P',monospace;color:var(--cream);margin:4px 0 2px}
#map .msub{font:19px 'VT323',monospace;color:var(--mute);margin-bottom:14px}
.ch{width:min(92vw,420px);display:flex;align-items:center;gap:12px;text-align:left;background:#17111f;border:3px solid #3a2e4a;box-shadow:0 0 0 2px #000;padding:12px;margin:0 0 12px;color:var(--cream)}
.ch.open{border-color:var(--cream);box-shadow:0 0 0 2px #000,4px 4px 0 2px var(--hot);animation:glowc 1.6s ease-in-out infinite}
@keyframes glowc{50%{box-shadow:0 0 0 2px #000,4px 4px 0 2px var(--pink),0 0 22px rgba(244,166,192,.35)}}
.ch.done{border-color:var(--gold)}
.ch.lock{opacity:.45}
.ch .n{font:16px 'Press Start 2P',monospace;color:var(--pink);width:44px;text-align:center;flex:none}
.ch .t{font:10px/1.5 'Press Start 2P',monospace}
.ch .s{font:19px/1 'VT323',monospace;color:var(--mute);margin-top:4px}
.ch .st{margin-left:auto;font:12px 'Press Start 2P',monospace;flex:none}
.ch.fin .n{color:var(--gold)}
#achs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(92vw,420px);margin:8px 0 12px}
.ach{font:8px/1.4 'Press Start 2P',monospace;padding:7px 8px;border:2px solid #3a2e4a;color:#6a5e7a;background:#120d18}
.ach.got{border-color:var(--gold);color:var(--gold);background:#231a0e}
#card{background:#000;z-index:30;transition:opacity .6s}
#card .cn{font:12px 'Press Start 2P',monospace;color:var(--pink);letter-spacing:.3em;margin-bottom:18px}
#card .ct{font:italic 700 clamp(30px,9vw,46px)/1.1 'Playfair Display',serif;color:var(--cream)}
#card .cs{font:22px 'VT323',monospace;color:var(--mute);margin-top:12px}
#mem{background:rgba(6,4,10,.86);z-index:25}
.pol{background:var(--cream);padding:12px 12px 16px;width:min(86vw,340px);transform:rotate(-2deg);box-shadow:0 20px 40px rgba(0,0,0,.6);animation:polin .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes polin{from{transform:rotate(-14deg) scale(.6);opacity:0}}
.pol .ph{width:100%;aspect-ratio:4/5;background:#2a2035;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pol img{width:100%;height:100%;object-fit:cover;display:block}
.pol .ph span{font:9px/1.6 'Press Start 2P',monospace;color:var(--pink);padding:12px}
.pol .mt{font:italic 700 20px 'Playfair Display',serif;color:var(--ink);margin:12px 0 4px}
.pol .mx{font:21px/1.1 'VT323',monospace;color:#3a2e2a}
#mem .pbtn{margin-top:22px}
#chat{background:rgba(6,4,10,.9);z-index:24}
.phone{width:min(90vw,340px);height:min(78vh,600px);background:#141018;border:4px solid var(--cream);box-shadow:0 0 0 4px #000,8px 8px 0 4px var(--hot);display:flex;flex-direction:column;border-radius:18px;overflow:hidden}
.phone .hd{padding:12px;border-bottom:3px solid #2a2035;font:9px 'Press Start 2P',monospace;color:var(--pink);display:flex;align-items:center;gap:10px}
.phone .hd i{width:26px;height:26px;border-radius:50%;background:#2a2035;display:inline-block;flex:none}
.msgs{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:8px}
.bb{max-width:78%;padding:8px 11px;font:21px/1.1 'VT323',monospace;animation:bin .25s}
@keyframes bin{from{transform:scale(.8);opacity:0}}
.bb.me{align-self:flex-start;background:#2a2238;color:var(--cream);border:2px solid #4a3e5a}
.bb.her{align-self:flex-end;background:var(--hot);color:#fff;border:2px solid #000}
.bb.typing{letter-spacing:.2em}
.chs{padding:10px;border-top:3px solid #2a2035;display:flex;flex-direction:column;gap:7px;min-height:12px}
.chs button{font:20px 'VT323',monospace;background:#231a2e;color:var(--cream);border:2px solid var(--pink);padding:9px;text-align:left}
.chs button:active{background:var(--hot)}
#fin{background:transparent;z-index:22;pointer-events:none;justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 12vh)}
#fin .l1{font:italic 700 clamp(26px,7.4vw,40px)/1.2 'Playfair Display',serif;color:var(--cream);text-shadow:0 4px 20px rgba(224,69,123,.6);min-height:1.2em}
#fin .l2{font:italic 500 clamp(18px,5vw,24px)/1.4 'Playfair Display',serif;color:var(--pink);margin-top:16px;opacity:0;transition:opacity 1.6s;max-width:520px}
#fin .l2.on{opacity:1}
#fin .poem{font:20px/1.25 'VT323',monospace;color:#d8cde8;margin-top:22px;opacity:0;transition:opacity 2s;max-width:460px}
#fin .poem.on{opacity:.95}
#fin{transition:background 1.6s}#fin.dim{background:rgba(5,4,20,.78)}
#fin .pbtn{pointer-events:auto;opacity:0;transition:opacity 1s;margin-top:26px}
#fin .pbtn.on{opacity:1}
#cred{background:#000;z-index:26;overflow:hidden;justify-content:flex-start}
#roll{position:absolute;left:0;right:0;top:100%;display:flex;flex-direction:column;align-items:center;padding:0 16px}
#roll .rh{font:9px 'Press Start 2P',monospace;color:var(--pink);letter-spacing:.2em;margin-top:26px}
#roll .rn{font:26px 'VT323',monospace;color:var(--cream);margin-top:6px}
#roll img{width:min(62vw,260px);border:6px solid var(--cream);margin:26px 0 0;transform:rotate(var(--r));box-shadow:0 10px 30px rgba(0,0,0,.7)}
#roll .big{font:italic 700 30px 'Playfair Display',serif;color:var(--cream);margin:40px 0 0}
#skip{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:2}
#prop{background:radial-gradient(ellipse at 50% 40%,#2a1030 0%,#07050c 70%);z-index:28;overflow:hidden}
#prop .pi{font:10px/1.8 'Press Start 2P',monospace;color:var(--pink);margin-bottom:12px;min-height:1.8em}
#ringc{width:min(64vw,260px);height:min(64vw,260px);cursor:pointer;image-rendering:pixelated}
#prop .q{font:italic 700 clamp(26px,7.4vw,38px)/1.2 'Playfair Display',serif;color:var(--cream);margin:10px 0 4px;opacity:0;transition:opacity 1.2s;max-width:520px}
#prop .q.on{opacity:1}
#yn{position:relative;width:min(92vw,420px);min-height:140px;display:none;flex-wrap:wrap;justify-content:center;align-items:center}
#yn.on{display:flex}
#noB{position:relative;transition:transform .18s}
#yesMsg{display:none;font:22px/1.2 'VT323',monospace;color:var(--cream);max-width:420px}
#yesMsg.on{display:block}
#yesMsg b{display:block;font:11px/1.6 'Press Start 2P',monospace;color:var(--gold);margin-bottom:10px}
.rain{position:fixed;top:-40px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(var(--rot))}}
#achT{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translate(-50%,-30px);opacity:0;z-index:50;background:#1c1426;border:3px solid var(--gold);box-shadow:0 0 0 2px #000;padding:10px 14px;font:9px/1.6 'Press Start 2P',monospace;color:var(--gold);transition:all .4s;pointer-events:none;white-space:nowrap}
#achT.on{opacity:1;transform:translate(-50%,0)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60;transition:opacity .45s}
#fade.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="top"><div id="chap" class="p2"></div><div><button class="ib" id="mapB" title="Chapters">&#9776;</button><button class="ib" id="musB" title="Sound">&#9835;</button></div></div>

<div id="stage">
  <canvas id="sc" width="960" height="1280"></canvas>
  <div id="tapHint"></div>
  <div id="ctrl"><button id="cl">&#9664;</button><button id="cr">&#9654;</button></div>
  <div id="dlgWrap"><div id="dlg"><div id="who"></div><div id="txt"></div><div id="nxt">&#9660;</div></div></div>
</div>

<div class="ov on" id="title">
  <div class="stars" id="tst"></div>
  <h1>A Little Game<br>About Us &#10084;&#65039;</h1>
  <div class="tsub" id="tsub">OUR STORY</div>
  <canvas id="duo" width="480" height="480"></canvas>
  <button class="pbtn" id="startB">START</button>
  <div class="press">&#9654; press start</div>
  <div class="by" id="tby"></div>
</div>

<div class="ov" id="map">
  <h2>OUR STORY</h2>
  <div class="msub">choose a chapter</div>
  <div id="chList"></div>
  <div class="p2" style="font-size:8px;color:var(--mute);margin:6px 0 8px">ACHIEVEMENTS</div>
  <div id="achs"></div>
  <button class="pbtn alt sm" id="resetB">reset progress</button>
  <div style="height:40px"></div>
</div>

<div class="ov" id="card"><div class="cn" id="cNum"></div><div class="ct" id="cTit"></div><div class="cs" id="cSub"></div></div>
<div class="ov" id="mem"><div class="pol"><div class="ph" id="mPh"></div><div class="mt" id="mT"></div><div class="mx" id="mX"></div></div><button class="pbtn" id="mGo">Continue &#9829;</button></div>
<div class="ov" id="chat"><div class="phone"><div class="hd"><i></i><span id="chatName">unknown number</span></div><div class="msgs" id="msgs"></div><div class="chs" id="chs"></div></div></div>
<div class="ov" id="fin"><div class="l1" id="fl1"></div><div class="l2" id="fl2"></div><div class="poem" id="fpo"></div><button class="pbtn" id="credB">roll credits &#9654;</button></div>
<div class="ov" id="cred"><div id="roll"></div><button class="pbtn alt sm" id="skip">skip &#9654;&#9654;</button></div>
<div class="ov" id="prop">
  <div class="pi" id="pIntro"></div>
  <canvas id="ringc" width="96" height="96"></canvas>
  <div class="q" id="pQ"></div>
  <div id="yn"><button class="pbtn" id="yesB"></button><button class="pbtn" id="yes2B"></button><button class="pbtn alt" id="noB"></button></div>
  <div id="yesMsg"><b id="yT"></b><span id="yX"></span><br><button class="pbtn sm" id="againB" style="margin-top:20px">back to chapters</button></div>
</div>
<div id="achT"></div>
<div id="fade"></div>
<audio id="bgm" loop preload="auto"></audio>

<script src="story.js"></script>
<script>
(()=>{
'use strict';
/* =============== core =============== */
const $=id=>document.getElementById(id);
const VW=240,VH=320,K=4;
const cv=$('sc');let g=cv.getContext('2d');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hash=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)};
const ME=CONFIG.me||'Batooti',HER=CONFIG.her||'Gawhara';

/* =============== save =============== */
const SK='ourstory_v1';let SV={done:[],ach:[]};
try{const s=JSON.parse(localStorage.getItem(SK)||'null');if(s&&Array.isArray(s.done))SV={done:s.done,ach:Array.isArray(s.ach)?s.ach:[]}}catch(e){}
const persist=()=>{try{localStorage.setItem(SK,JSON.stringify(SV))}catch(e){}};

/* =============== sound =============== */
let AC=null,sfxOn=true;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,d,type,v,w,f2){if(!sfxOn)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),gn=a.createGain(),s=a.currentTime+(w||0);o.type=type||'square';o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);gn.gain.setValueAtTime(v||.04,s);gn.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(gn);gn.connect(a.destination);o.start(s);o.stop(s+d+.02)}catch(e){}}
const SFX={
  ui:()=>tone(1100,.05,'square',.03),
  blip:w=>tone(w==='her'?880+Math.random()*80:w==='me'?520+Math.random()*50:680,.03,'square',.018),
  good:()=>[660,880,1175].forEach((f,i)=>tone(f,.12,'square',.035,i*.07)),
  pop:()=>tone(900,.08,'triangle',.05,0,1400),
  meow:()=>{tone(700,.22,'sawtooth',.03,0,1100);tone(1000,.25,'sawtooth',.025,.2,600)},
  bad:()=>{tone(220,.12,'square',.04);tone(160,.16,'square',.04,.1)},
  star:i=>tone([523,587,659,784,880,1047,1175,1319,1568,1760,2093,2349,2637,3136][i%14],.35,'triangle',.05),
  done:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.22,'square',.035,i*.11)),
  ach:()=>[988,1319].forEach((f,i)=>tone(f,.14,'square',.035,i*.09)),
  win:()=>[392,523,659,784,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'square',.035,i*.15)),
  msg:()=>tone(1320,.06,'sine',.04),
  zz:n=>tone(300+n*60,.2,'sine',.05)
};
const bgm=$('bgm');if(CONFIG.music)bgm.src=CONFIG.music;
function setSound(v){sfxOn=v;$('musB').classList.toggle('off',!v);if(v&&CONFIG.music)bgm.play().catch(()=>{});else bgm.pause()}
$('musB').onclick=()=>{ac();setSound(!sfxOn)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)bgm.pause();else if(sfxOn&&started&&CONFIG.music)bgm.play().catch(()=>{})});

/* =============== images =============== */
const her=new Image();let herOK=false;her.onload=()=>herOK=true;her.src=CONFIG.sprite;

/* =============== pixel helpers =============== */
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function blob(cx,cy,r,c){g.fillStyle=c;for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(r*r-y*y));g.fillRect(Math.round(cx-w),Math.round(cy+y),w*2,1)}}
const HP=['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'];
function pxH(x,y,s,c,hi){g.fillStyle=c;for(let r=0;r<6;r++)for(let q=0;q<7;q++)if(HP[r][q]==='X')g.fillRect(Math.round(x+q*s),Math.round(y+r*s),s,s);if(hi){g.fillStyle=hi;g.fillRect(Math.round(x+s),Math.round(y+s),s,s)}}
function glow(x,y,r,col,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=a==null?1:a;g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);g.globalAlpha=1}
const STARS=[...Array(160)].map((_,i)=>({x:hash(i,1)*VW,y:hash(i,2)*VH,s:hash(i,3)>.88?2:1,p:hash(i,4)*6.3}));
function stars(t,maxY,dim){for(const s of STARS){if(s.y>maxY)continue;g.globalAlpha=(dim||1)*(.35+.65*Math.abs(Math.sin(t*1.2+s.p)));R(s.x,s.y,s.s,s.s,'#fff')}g.globalAlpha=1}
function drawHer(x,y,h,o={}){
  if(!herOK){pxH(x-7,y-12,2,'#e0457b');return}
  const w=h*her.width/her.height;g.save();g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.translate(x,y);
  if(o.rot){g.rotate(o.rot)}if(o.flip)g.scale(-1,1);if(o.alpha!=null)g.globalAlpha=o.alpha;
  g.drawImage(her,-w/2,-h,w,h);g.restore();g.imageSmoothingEnabled=false;g.globalAlpha=1;
}
function drawHim(cx,y,h,flip){
  const u=h/100;const L=(x,yy,w,hh,c)=>{const xx=flip?cx-(x+w)*u:cx+x*u;R(xx,y+yy*u,w*u,hh*u,c)};
